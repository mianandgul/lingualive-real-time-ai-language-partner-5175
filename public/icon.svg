<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08" />

  <!-- Sound wave ripples -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.25" stroke-dasharray="12 12" />
  <circle cx="256" cy="230" r="110" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.4" />

  <!-- Central microphone icon -->
  <g filter="url(#shadow)">
    <!-- Mic capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="#ffffff" />
    <!-- Mic capsule inner lines -->
    <line x1="236" y1="180" x2="276" y2="180" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" />
    <line x1="236" y1="205" x2="276" y2="205" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" />
    <line x1="236" y1="230" x2="276" y2="230" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" />

    <!-- Mic cradle arc -->
    <path d="M 186 230 C 186 280, 326 280, 326 230" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Mic stem -->
    <line x1="256" y1="285" x2="256" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Mic base -->
    <line x1="206" y1="340" x2="306" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="340" cy="140" r="18" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#shadow)" />
</svg>
