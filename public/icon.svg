<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Speech Waveform Crest Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Sound Bars Gradient -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Atmospheric Glow Center -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.12" filter="blur(40px)" />

  <!-- Acoustic Dialogue Crest with Filter -->
  <g filter="url(#logoShadow)">
    <!-- Speech Dialogue Outer Waveform -->
    <path
      d="M 140 256 C 140 180 200 120 276 120 C 352 120 412 180 412 256 C 412 332 352 392 276 392 C 248 392 222 384 200 370 L 132 392 L 152 328 C 144 306 140 282 140 256 Z"
      fill="none"
      stroke="url(#waveGrad)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Harmonic Sound Frequency Bars in Aperture -->
    <rect x="216" y="218" width="24" height="76" rx="12" fill="url(#bar1Grad)" />
    <rect x="264" y="176" width="24" height="160" rx="12" fill="url(#bar2Grad)" />
    <rect x="312" y="202" width="24" height="108" rx="12" fill="url(#bar3Grad)" />
  </g>

  <!-- Live Active Glowing Indicator Dot -->
  <g filter="url(#pulseGlow)">
    <circle cx="396" cy="136" r="26" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <circle cx="396" cy="136" r="12" fill="#ffffff" />
  </g>
</svg>
